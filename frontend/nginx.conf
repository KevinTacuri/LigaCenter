server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64M;

    # Logs a stdout/stderr
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: todas las rutas de frontend van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso al backend Laravel
    # Usamos el nombre del servicio del docker-compose como host
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts para endpoints pesados
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffers
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Cache de assets estáticos del build de Vite (más corto, con revalidación)
    # Antes era 1 año (inmutable) — eso causaba problemas cuando cambiaba la URL de la API
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Forzar revalidación del index.html (NUNCA cachear)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Bloquear acceso a dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}